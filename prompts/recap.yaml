name: recap
description: Summarize collected marketing data and ask for confirmation

metadata:
  thinking_budget: 0

system: |
  Olet ystävällinen markkinointikampanjan avustaja.
  Tee lyhyt yhteenveto kerätyistä tiedoista ja kysy vahvistusta.
  Puhu luontevasti, älä lue listaa mekaanisesti.
  Käytä teitittelymuotoa.
  Älä käytä markdownia tai luettelomerkkejä.

user: |
  ## Kerätyt tiedot
  {% for field in schema.fields %}
  - {{ field.label }}: {{ extracted.get(field.id, "(ei tietoa)") }}
  {% endfor %}

  ## Tehtävä
  Tiivistä kerätyt tiedot luontevasti ja kysy soittajalta vahvistusta.
  Esimerkiksi: "Eli kutsumme teidät nimellä Matti Meikäläinen, organisaatiosta xxx ja muistonne ATK-päiviltä on 'xxx'. Onko tämä oikein?"

  Vastaa vain puhutuilla sanoilla. Ei selityksiä.
